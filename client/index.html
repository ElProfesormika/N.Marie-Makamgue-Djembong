<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Marie Nicaise Makamgue Djembong · Mama Coco</title>
    <meta
      name="description"
      content="Portfolio de Marie Nicaise Makamgue Djembong, alias Mama Coco. Coach business, confiance en soi et matrimoniale. Fondatrice-présidente de l'AISBL Un Geste Divin."
    />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/mama-coco-logo.png" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("mama_coco_theme");
          var night = saved ? saved === "night" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = night ? "night" : "day";
        } catch (e) {
          document.documentElement.dataset.theme = "day";
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
